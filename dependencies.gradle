apply from: 'helpers.gradle'

dependencies {
    // Include StripLatestForgeRequirements by default for the dev env, saves everyone a hassle
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Deobfuscating dependencies:
    // rfg.deobf('curse.maven:had-enough-items-557549:4543375')
    // By wrapping a dependency descriptor in rfg.deobf() method call, the dependency is queued for deobfuscation
    // When deobfuscating, RFG respects the mapping_channel + mapping_version stated in gradle.properties

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation = dependency available at both compile time and runtime
    // runtimeOnly = runtime dependency
    // compileOnly = compile time dependency
    // annotationProcessor = annotation processing dependencies
    // embed = bundle dependencies into final output artifact (no relocation)

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }

    compileOnly(rfg.deobf(project.files("libs/ae2-uel-v0.56.7-5-g26bb598-dev.jar")))
    compileOnly(rfg.deobf(project.files("libs/gcyl-1.12.2-0.1.0-beta-dev.jar")))
    compileOnly(rfg.deobf(project.files("libs/gregtech-1.12.2-2.9.0-beta-dev.jar")))
    compileOnly(rfg.deobf(project.files("libs/CodeChickenLib-1.12.2-3.2.3.358-universal.jar")))
    compileOnly("curse.maven:had-enough-items-557549:5906628")
    compileOnly("curse.maven:theoneprobe-245211:2667280")
    compileOnly("org.jetbrains:annotations:26.1.0")
    compileOnly("curse.maven:susypatches-1319894:8558800")
    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")
    // Non-published dependencies
    // Change any to devOnlyNonPublishable to test them in-game.
    compileOnly("curse.maven:journeymap-32274:5172461") // Journeymap 5.7.1p3
    compileOnly("curse.maven:voxelmap-225179:3029445") // VoxelMap 1.9.28
    compileOnly("curse.maven:xaeros-263420:5394758") // Xaero's Minimap 24.2.0
    compileOnly("curse.maven:FTBLib-237167:2985811") //FTB Library 5.4.7.2
    compileOnly("curse.maven:FTBUtilities-237102:3157548") // FTB Utilities 5.4.1.131
    //devOnlyNonPublishable rfg.deobf("curse.maven:ftb-library-legacy-forge-237167:2985811") // FTB Library 5.4.7.2
    //devOnlyNonPublishable rfg.deobf("curse.maven:ftb-utilities-forge-237102:3157548") // FTB Utilities 5.4.1.131
    compileOnly(rfg.deobf("curse.maven:opencomputers-223008:5274236")) // OpenComputers 1.8.5+179e1c3
    compileOnly(rfg.deobf("curse.maven:hwyla-253449:2568751")) // HWYLA 1.8.26-B41
    compileOnly(rfg.deobf("curse.maven:baubles-227083:2518667")) // Baubles 1.5.2
    compileOnly(rfg.deobf("curse.maven:forestry-59751:2684780")) // Forestry 5.8.2.387
    compileOnly(rfg.deobf("curse.maven:chisel-235279:2915375")) // Chisel 1.0.2.45
    compileOnly(rfg.deobf("curse.maven:littletiles-257818:4750222")) // LittleTiles 1.5.82-1.12.2
    compileOnly(rfg.deobf("curse.maven:creativecore-257814:4722163")) // Creative Core 1.10.71
    api("com.cleanroommc:modularui:3.1.6") { transitive = false }
    api("com.cleanroommc:groovyscript:1.4.3") { transitive = false }
}